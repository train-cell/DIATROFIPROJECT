name: Orchard
options:
  bundleIdPrefix: com.skyd3n
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  SWIFT_VERSION: "6.0"
  SWIFT_STRICT_CONCURRENCY: complete
  ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Orchard:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: Domain
      - path: Services
      - path: Features
      - path: DesignSystem
      - path: Resources
      - path: Widget
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.skyd3n.orchard
      DEVELOPMENT_TEAM: BKSGR5Q3JL
      INFOPLIST_FILE: Resources/Info.plist
      CODE_SIGN_ENTITLEMENTS: Resources/Orchard.entitlements
      CODE_SIGN_STYLE: Automatic
      SUPPORTED_PLATFORMS: "iphonesimulator iphoneos"
      SUPPORTS_MACCATALYST: NO
      ASSETCATALOG_COMPILER_APPICON_NAME: ""

  OrchardTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: Orchard
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.skyd3n.orchardTests
      DEVELOPMENT_TEAM: BKSGR5Q3JL
      SUPPORTED_PLATFORMS: "iphonesimulator iphoneos"

schemes:
  Orchard:
    build:
      targets:
        Orchard: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OrchardTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
